<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelly-Fluid-like</title>
    <!-- kode dari chat-gpt sir😁 -->
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
  cursor: none;
}

.liquid{
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}

body:hover .liquid{
  opacity: 1;
}

.bks-liquid {
  position: absolute;
  width: 140%;
  height: 140%;
  top: -20%;
  left: -20%;
  filter: blur(80px) contrast(160%);
  animation: morph 12s infinite alternate ease-in-out;
}

.cursor-jelly {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, red, yellow);
  filter: blur(50px);
  pointer-events: none;
  transition: transform 0.05s linear;
}

@keyframes morph {
  0% {
    border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
  }
  50% {
    border-radius: 60% 40% 45% 55% / 40% 60% 40% 60%;
  }
  100% {
    border-radius: 45% 55% 60% 40% / 55% 45% 60% 40%;
  }
}
</style>
</head>

<body>

<div class="liquid">
  <div class="bks-liquid">

  </div>
  <div class="cursor-jelly" id="cursorJelly">
    
  </div>
</div>

<script>
const jelly = document.getElementById("cursorJelly");

let mouseX = 0;
let mouseY = 0;
let currentX = 0;
let currentY = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX - 100;
  mouseY = e.clientY - 100;
});

function animate() {
  currentX += (mouseX - currentX) * 0.15;
  currentY += (mouseY - currentY) * 0.15;

  jelly.style.transform = `translate(${currentX}px, ${currentY}px)`;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
