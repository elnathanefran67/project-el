<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 not founded</title>
    <link rel="shortcut icon" href="computer.png">
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: monospace;
        }
        .out{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(white, rgb(203, 203, 203), grey);
        }
        .bks{
            width: 60%;
            height: 60vh;
            box-shadow: 10px 5px 100px 15px grey;
            text-align: center;
            font-size: 26px;
        }
        .b button{
            border-radius: 15px;
            width: 50%;
            transition: ease-in-out;
        }
        .o button{
            background: linear-gradient(to right, black, rgb(34, 34, 34));
            color: white;
            font-size: 20px;
            width: 125px;
            height: 60px;
            transition: ease-in-out;
        }
        .o button:hover{
            transform: scale(1.2);
            transition: 0.15s ease-in-out;
        }
        .l button{
            background: linear-gradient(to right, white, rgb(195, 195, 195));
            border: none;
            font-size: 20px;
            width: 125px;
            height: 60px;
        }
        .l button:hover{
            transform: scale(1.2);
            transition: 0.15s ease-in-out;
        }
        .b{
            width: 35%;
            height: 10vh;
            justify-self: center;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        @media(max-width:391px){
            .bks{
                width: 100%;
            }
            .o button, .l button{
                width: 100px;
            }
            .b{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="out">
        <div class="bks">
            <h1>404 ERROR PAGE NOT FOUNDED?</h1>
            <h1 style="visibility: hidden;">t</h1>
            <div class="b">
                <div class="o">
                    <button onclick="goToPage()">Back</button>
                </div>
                <div class="l">
                    <button onclick="alert('404 ERROR PAGE, click back')">Help</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function goToPage() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
